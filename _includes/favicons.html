<!--
  Override of the theme's favicons.html: adds a cache-busting query string
  so browsers (which cache favicons very aggressively, separately from
  normal page cache) pick up new icons without a manual cache clear.
-->

{% capture favicon_path %}{{ '/assets/img/favicons' | relative_url }}{% endcapture %}
{% assign favicon_v = "2" %}

<link rel="icon" type="image/png" href="{{ favicon_path }}/favicon-96x96.png?v={{ favicon_v }}" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="{{ favicon_path }}/favicon.svg?v={{ favicon_v }}">
<link rel="shortcut icon" href="{{ favicon_path }}/favicon.ico?v={{ favicon_v }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ favicon_path }}/apple-touch-icon.png?v={{ favicon_v }}">
{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ favicon_path }}/site.webmanifest?v={{ favicon_v }}">
{% endif %}
